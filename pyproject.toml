[project]
name = "app"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "elevenlabs>=2.74.1",
    "fastapi>=0.162.0",
    "firecrawl-py>=4.54.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.32",
    "sse-starlette>=3.6.0",
    "tavily-python>=0.8.5",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "playwright>=1.64.1",
    "pytest>=9.2.0",
    "respx>=0.23.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]
addopts = "-q --tb=short"
