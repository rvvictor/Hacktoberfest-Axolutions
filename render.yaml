# Built by uak deploy · Render Blueprint: dashboard → New → Blueprint → this repo; fill the sync: false values.
services:
  - type: web
    name: hack-001
    runtime: docker
    plan: starter   # a free instance sleeps after 15 min idle: the first request of a live demo then waits ~1 min
    autoDeploy: true   # every push to main redeploys
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BACKBOARD_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: ELEVENLABS_AGENT_ID
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: MIRO_ACCESS_TOKEN
        sync: false
      - key: LINEAR_API_KEY
        sync: false
      - key: LINEAR_TEAM_ID
        sync: false
      - key: LOVABLE_PREBUILT_URL
        sync: false
